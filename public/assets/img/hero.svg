<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#a855f7" stop-opacity=".55"/><stop offset=".55" stop-color="#7c3aed" stop-opacity=".18"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d0e57"/><stop offset="1" stop-color="#0b0430"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b3bb0"/><stop offset="1" stop-color="#241257"/></linearGradient>
    <linearGradient id="ct" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9d5ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="cr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <symbol id="cube" viewBox="0 0 40 48" overflow="visible">
      <polygon points="20,0 40,12 20,24 0,12" fill="url(#ct)"/>
      <polygon points="0,12 20,24 20,48 0,36" fill="url(#cl)"/>
      <polygon points="20,24 40,12 40,36 20,48" fill="url(#cr)"/>
      <path d="M0 12 20 0l20 12M20 24v24" stroke="#f5f3ff" stroke-opacity=".55" stroke-width=".8"/>
    </symbol>
  </defs>

  <ellipse cx="300" cy="270" rx="290" ry="190" fill="url(#glow)"/>
  <!-- floor rings -->
  <ellipse cx="300" cy="372" rx="250" ry="42" stroke="url(#edge)" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 7"/>
  <ellipse cx="300" cy="372" rx="200" ry="30" stroke="#a855f7" stroke-opacity=".45" stroke-width="1.2"/>
  <ellipse cx="300" cy="372" rx="150" ry="20" fill="#7c3aed" fill-opacity=".25" filter="url(#soft)"/>

  <!-- laptop screen -->
  <g>
    <rect x="128" y="92" width="344" height="222" rx="18" fill="#0a0524" stroke="url(#edge)" stroke-width="3"/>
    <rect x="142" y="106" width="316" height="194" rx="9" fill="url(#scr)"/>
    <rect x="142" y="106" width="316" height="194" rx="9" stroke="#8b5cf6" stroke-opacity=".35"/>
    <!-- window dots -->
    <circle cx="160" cy="122" r="3.5" fill="#fb7185"/><circle cx="173" cy="122" r="3.5" fill="#fbbf24"/><circle cx="186" cy="122" r="3.5" fill="#34d399"/>
    <!-- code lines -->
    <g fill="#8b5cf6" fill-opacity=".55">
      <rect x="160" y="146" width="62" height="6" rx="3"/><rect x="172" y="162" width="88" height="6" rx="3" fill="#c084fc" fill-opacity=".7"/>
      <rect x="172" y="178" width="48" height="6" rx="3"/><rect x="160" y="194" width="74" height="6" rx="3" fill="#e879f9" fill-opacity=".6"/>
      <rect x="172" y="210" width="96" height="6" rx="3"/><rect x="172" y="226" width="58" height="6" rx="3" fill="#c084fc" fill-opacity=".7"/>
      <rect x="160" y="242" width="40" height="6" rx="3"/><rect x="160" y="268" width="110" height="6" rx="3" fill-opacity=".35"/>
    </g>
    <!-- </> glyph -->
    <g filter="url(#neon)" stroke="url(#edge)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M338 168 296 202l42 34"/>
      <path d="M392 168 434 202l-42 34" transform="translate(-4 0)"/>
      <path d="M382 160 348 246" stroke-width="12"/>
    </g>
  </g>
  <!-- laptop base -->
  <path d="M92 314h416l34 26c3 3 1 8-4 8H62c-5 0-7-5-4-8l34-26Z" fill="url(#base)" stroke="#8b5cf6" stroke-opacity=".7"/>
  <path d="M92 314h416" stroke="#c4b5fd" stroke-opacity=".6" stroke-width="2"/>
  <rect x="258" y="324" width="84" height="9" rx="4.5" fill="#1a0b45" stroke="#8b5cf6" stroke-opacity=".5"/>

  <!-- floating API cube -->
  <g transform="translate(446 22) scale(1.9)" filter="url(#neon)"><use href="#cube" width="40" height="48"/></g>
  <g font-family="Rajdhani,Segoe UI,Arial,sans-serif" font-weight="800" font-size="19" fill="#fff">
    <text transform="translate(450 79) skewY(31)">API</text>
  </g>
  <!-- small cubes -->
  <g opacity=".95"><g transform="translate(40 118) scale(.9)" filter="url(#neon)"><use href="#cube" width="40" height="48"/></g></g>
  <g opacity=".9"><g transform="translate(528 262) scale(.7)"><use href="#cube" width="40" height="48"/></g></g>
  <g opacity=".8"><g transform="translate(86 300) scale(.55)"><use href="#cube" width="40" height="48"/></g></g>
  <g opacity=".7"><g transform="translate(212 28) scale(.5)"><use href="#cube" width="40" height="48"/></g></g>

  <!-- connectors -->
  <path d="M472 150 520 186" stroke="#a855f7" stroke-opacity=".6" stroke-dasharray="3 5"/>
  <path d="M128 170 78 150" stroke="#a855f7" stroke-opacity=".6" stroke-dasharray="3 5"/>
  <g fill="#e9d5ff"><circle cx="520" cy="186" r="3.5"/><circle cx="78" cy="150" r="3.5"/><circle cx="560" cy="120" r="2"/><circle cx="30" cy="250" r="2.5"/><circle cx="330" cy="40" r="2"/><circle cx="570" cy="330" r="2"/><circle cx="130" cy="400" r="2"/></g>
</svg>
